name: Habs game-day dashboard

on:
  schedule:
    - cron: "0 13 * * *"   # 9:00 EDT / 8:00 EST (GitHub cron is UTC)
    - cron: "0 21 * * *"   # pre-game refresh, 17:00 EDT / 16:00 EST
  workflow_dispatch:        # "Run workflow" button for manual builds

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep past-season data between runs. Without this, every run makes
      # several hundred API calls.
      - uses: actions/cache@v4
        with:
          path: .nhl_cache
          key: nhl-${{ github.run_id }}
          restore-keys: nhl-

      - name: Build page
        run: |
          mkdir -p site
          python3 habs_gameday.py --refresh --out site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
